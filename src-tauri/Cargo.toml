[package]
name = "cardio-qspr"
version = "2.0.0"
description = "CardioQSPR - QSPR Regression Engine for Cardiovascular Drugs"
authors = ["Matheus de Pra <matheusdepra@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
opt-level = "s"
strip = true
